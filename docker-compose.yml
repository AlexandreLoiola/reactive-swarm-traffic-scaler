services:
  backend:
    image: java-backend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'  
          memory: 512M  
        reservations:
          cpus: '0.25' 
          memory: 256M 
      restart_policy:
        condition: on-failure
      labels:
        app: backend
        scalable: "true"
    networks:
      - app-net
    
  autoscaler:
    image: autoscaler
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-net

  nginx:
    image: nginx-lb
    ports:
      - "80:80"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - app-net

networks:
  app-net:
    driver: overlay
