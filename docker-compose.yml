services:
  backend:
    image: java-backend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'  
          memory: 512M  
        reservations:
          cpus: '0.25' 
          memory: 256M 
      restart_policy:
        condition: on-failure
      labels:
        app: backend
        scalable: "true"
    networks:
      - app-net
    
  autoscaler:
    image: autoscaler
    user: root
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:z
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-net

  nginx:
    image: nginx-lb
    ports:
      - "80:80"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - app-net

  grafana:
    image: grafana/grafana
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-net


  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-net

networks:
  app-net:
    driver: overlay